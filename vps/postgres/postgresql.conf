# ============================================================
# PostgreSQL 16 - Tuning para Hetzner CCX23 (4 vCPU / 16 GB RAM / NVMe)
#
# Si usas otro plan, ajusta:
#   8 GB RAM  -> shared_buffers=2GB,  effective_cache_size=6GB
#   16 GB RAM -> shared_buffers=4GB,  effective_cache_size=12GB  (este archivo)
#   32 GB RAM -> shared_buffers=8GB,  effective_cache_size=24GB
# ============================================================

listen_addresses = '*'
port = 5432

# --- Memoria ---
shared_buffers = 4GB
effective_cache_size = 12GB
maintenance_work_mem = 1GB
wal_buffers = 16MB
work_mem = 20MB

# --- Conexiones ---
max_connections = 200

# --- NVMe SSD ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Checkpoints / WAL ---
checkpoint_completion_target = 0.9
min_wal_size = 1GB
max_wal_size = 4GB
wal_level = replica          # deja listo el servidor para réplicas de lectura
max_wal_senders = 3

# --- Paralelismo (4 vCPU) ---
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# --- Seguridad / higiene ---
password_encryption = 'scram-sha-256'
idle_in_transaction_session_timeout = '60s'   # evita conexiones colgadas

# --- Observabilidad ---
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 1000   # logea queries de más de 1s
log_timezone = 'UTC'
timezone = 'UTC'
default_statistics_target = 100
