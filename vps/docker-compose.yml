name: trxkeeper-db

# ============================================================
# TronKeeper DB Stack (self-hosted, compatible con Supabase REST)
# Servicios:
#   postgres  -> PostgreSQL 16 (datos)
#   postgrest -> API REST /rest/v1/* (mismo formato que Supabase)
#   caddy     -> HTTPS + reverse proxy (db.tudominio.com)
#   scheduler -> expira claims cada minuto + backup diario
# ============================================================

services:
  postgres:
    image: postgres:16
    container_name: tk-postgres
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trxkeeper}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?Configura AUTHENTICATOR_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    # Solo localhost: Postgres NUNCA expuesto a internet.
    # Para administrar: ssh -L 5432:localhost:5432 root@TU_VPS
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgrest:
    image: postgrest/postgrest:v12
    container_name: tk-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?Configura AUTHENTICATOR_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-trxkeeper}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      PGRST_SERVER_PORT: "3000"
      PGRST_DB_POOL_SIZE: "25"
      PGRST_LOG_LEVEL: info
    # Sin ports: solo accesible vía Caddy (red interna de Docker)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: tk-caddy
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "80:80"
      - "443:443"
    environment:
      DB_DOMAIN: ${DB_DOMAIN:?Configura DB_DOMAIN en .env (ej: db.tudominio.com)}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build: ./scheduler
    container_name: tk-scheduler
    restart: unless-stopped
    depends_on:
      - postgres
      - postgrest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trxkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGREST_URL: http://postgrest:3000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Configura SERVICE_ROLE_KEY en .env}
      TZ: UTC
    volumes:
      - ./backups:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
