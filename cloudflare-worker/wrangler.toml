name = "tronkeeper-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# La configuración (BOT_TOKEN, SUPA_URL, SUPA_SERVICE_KEY, TON_API_KEY,
# ADMIN_TOKEN) se setea en el dashboard. Wrangler BORRA en cada deploy las
# variables de texto configuradas ahí y las reemplaza por las de este archivo;
# keep_vars = true evita que un deploy de Git deje al Worker sin configuración.
keep_vars = true

[vars]
# Non-sensitive variables (optional)

# Secrets (set via wrangler secret put):
# - BOT_TOKEN
# - SUPA_URL
# - SUPA_SERVICE_KEY
# - TON_API_KEY
# - ADMIN_TOKEN

[triggers]
# Scan the TON treasury and credit MEMO deposits every two minutes.
crons = ["*/2 * * * *"]
