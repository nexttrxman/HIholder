name = "tronkeeper-api"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
# Non-sensitive variables (optional)

# Secrets (set via wrangler secret put):
# - BOT_TOKEN
# - SUPA_URL            -> Supabase: https://xxxxx.supabase.co
#                          VPS híbrido (ver /vps/GUIA-VPS.md): https://db.tudominio.com
# - SUPA_SERVICE_KEY    -> Supabase: service_role key del dashboard
#                          VPS híbrido: SERVICE_ROLE_KEY generado con vps/scripts/generate-jwt.py
# - TON_API_KEY         -> TON Center API key (recomendada, mayor rate limit)
